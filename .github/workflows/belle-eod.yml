name: Belle eod

on:
  schedule:
    - cron: "5 20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Post now, even if it is not the scheduled time"
        default: "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests
      - run: python bots/belle.py eod
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORCE_POST: ${{ github.event.inputs.force }}
      - name: Save the day to the repo
        run: |
          git config user.name "belle-bot"
          git config user.email "belle-bot@users.noreply.github.com"
          git add data || true
          git commit -m "Belle EOD archive $(date +%F)" || echo "nothing to commit"
          git push || true

