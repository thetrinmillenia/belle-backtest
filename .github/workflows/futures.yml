name: Futures paper

# Every Belle alert as 1 MES on paper (Titi, Oct 31). Scored after the close from Belle's ES archive. No orders, no Discord.
on:
  schedule:
    - cron: "40 20,21 * * 1-5"   # 16:40 ET in daylight and standard time, after the EOD archive; a second run just rewrites the day
  workflow_dispatch:
    inputs:
      dates:
        description: "Backfill these days (YYYY-MM-DD, comma separated). Empty = today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python bots/futures_paper.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DATES: ${{ github.event.inputs.dates }}
      - name: Save the results
        run: |
          git config user.name nora-bot
          git config user.email nora-bot@users.noreply.github.com
          git add results/futures_paper.csv
          git commit -m "Futures paper results" || true
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done || true
