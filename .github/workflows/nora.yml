name: Nora recap

# Nora, the record keeper: daily recap after the close (16:10 ET), weekly recap on Fridays.
on:
  schedule:
    - cron: "10 20,21 * * 1-5"   # 16:10 ET in both daylight and standard time; the script skips the wrong one
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if it is not 16:xx ET (1 = yes)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python bots/nora.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ github.event.inputs.force }}
      - name: Save Nora's log
        if: always()
        run: |
          git config user.name nora-bot
          git config user.email nora-bot@users.noreply.github.com
          git add results/nora_trades.csv || true
          git commit -m "Nora trade log" || true
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done || true
