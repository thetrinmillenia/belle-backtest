name: Nora recap

# Nora, the record keeper (no Discord posts, Titi Oct 19): daily recap after the close (16:10 ET), weekly recap on Fridays.
on:
  schedule:
    - cron: "10 20,21 * * 1-5"   # 16:10 ET in both daylight and standard time; the script skips the wrong one
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if it is not 16:xx ET (1 = yes)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python bots/nora.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FORCE: ${{ github.event.inputs.force }}
      - name: Nora loss library and journal update
        run: python bots/nora_learn.py
        env:
          NORA_SHEET_URL: ${{ secrets.NORA_SHEET_URL }}
      - name: Shadow trades (alerts Penny skipped)
        run: python bots/shadow.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MODE: eval
      - name: Save Nora's log
        if: always()
        run: |
          git config user.name nora-bot
          git config user.email nora-bot@users.noreply.github.com
          git add results/nora_trades.csv || true
          git add results/shadow_trades.csv || true
          git add results/loss_library.csv || true
          git add results/win_library.csv || true
          git add results/pattern_stats.csv || true
          git add results/lessons_library.csv || true
          git commit -m "Nora trade log" || true
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done || true
