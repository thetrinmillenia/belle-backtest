name: Belle Drafts (morning posts)
# 8:20 AM ET (7:20 AM CT) on weekdays: the opener and the game plan, to Titi's private #belle-drafts channel.
# Scheduled at :05 because GitHub starts scheduled jobs late; the script waits until 8:20 ET.
on:
  schedule:
    - cron: "5 12,13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "1 = post now (test)"
        default: "1"
jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python bots/belle_drafts.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          STUDENT_WEBHOOK_URL: ${{ secrets.STUDENT_WEBHOOK_URL }}
          FORCE: ${{ github.event.inputs.force }}
