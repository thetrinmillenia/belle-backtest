name: Harper review

# Harper, the manager: daily review after the close (16:30 ET). Read only, paper account, no Discord posts.
on:
  schedule:
    - cron: "30 20,21 * * 1-5"   # 16:30 ET in both daylight and standard time; the script skips the wrong one
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if it is not 16:xx ET (1 = yes)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python bots/harper.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NORA_SHEET_URL: ${{ secrets.NORA_SHEET_URL }}
          FORCE: ${{ github.event.inputs.force }}
      - name: Save Harper's review
        if: always()
        run: |
          git config user.name harper-bot
          git config user.email harper-bot@users.noreply.github.com
          git add results/harper || true
          git commit -m "Harper daily review" || true
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done || true
