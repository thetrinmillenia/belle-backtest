name: Belle ORB (30 min opening range, 15m)
# 09:35 ET (08:35 CT) on weekdays, backup 09:50 ET: watches the ORH / ORL rules until 12:35 ET, posts to Discord,
# Penny trades on the Alpaca PAPER account, and every break's size and volume is saved to results/or_breaks.csv.
on:
  schedule:
    - cron: "35,50 13,14 * * 1-5"
  workflow_dispatch:
    inputs:
      replay:
        description: "Test date YYYY-MM-DD (posts [TEST], no orders). Empty = live"
        default: ""
concurrency:
  group: belle-orb
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  orb:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -m py_compile bots/belle_or.py bots/belle_manage.py bots/belle_stall.py
      - run: python bots/belle_or.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLAY: ${{ github.event.inputs.replay }}
      - name: Save the break data
        run: |
          git config user.name "belle-orb"
          git config user.email "actions@users.noreply.github.com"
          git add results/or_breaks.csv || true
          git commit -m "ORB break data $(date +%F)" || exit 0
          git pull --rebase || true
          git push || true
